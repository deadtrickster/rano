[package]
name = "rano"
version = "0.8.1"
edition = "2024"

[dependencies]
# gzip, for reading a release asset. Pure Rust (miniz_oxide): a decompressor that
# cannot deadlock, which is not true of shelling out to `gzip` and pumping its
# pipes by hand. See `update::extract_binary` for what that cost twice.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Raw mode, the window size and the host name, for `rano::term`: the only C the
# terminal layer needs. Already in the tree (through tree-sitter's and others'
# dependencies), so this is a direct edge to a crate already built, not a new one.
libc = "0.2"
tree-sitter = "0.27"
tree-sitter-language = "0.1"
tree-sitter-rust = "0.24"
tree-sitter-go = "0.25"
tree-sitter-bash = "0.25"
tree-sitter-python = "0.25"
tree-sitter-c = "0.24"
tree-sitter-json = "0.24"
tree-sitter-commonlisp = "0.4.1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-yaml = "0.7.2"
tree-sitter-md = "0.5.3"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-html = "0.23.2"
tree-sitter-css = "0.25.0"
tree-sitter-lua = "0.5.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-php = "0.24.2"
tree-sitter-java = "0.23.5"
tree-sitter-make = "1.1.1"
tree-sitter-ini = "1.4.0"
tree-sitter-diff = "0.1.0"
tree-sitter-elisp = "1.7.2"
tree-sitter-scheme = "0.24.7"
tree-sitter-sequel = "0.3.11"
tree-sitter-clojure-orchard = "0.2.8"

[build-dependencies]
cc = "1"

# What the release assets are built with. The binary is large because of what is
# IN it rather than because of how it was built: 28 tree-sitter grammars compiled
# from C, each a few hundred KB of static parse tables, plus the Rust std. So this
# is about not carrying weight that buys nothing:
#
#   strip           symbols, for a binary nobody debugs. Measured alone: ~1 MB.
#   lto             cross-crate inlining — and for a program that is mostly a few
#                   large dependency crates, it is also a size win.
#   codegen-units=1 one codegen unit for the whole crate, so lto can actually see
#                   everything. It costs build time and buys both speed and size.
#
# Deliberately NOT `opt-level = "z"`: this editor's release profile is the one the
# §16.0 work was measured on (typing at 0.1 µs on a 193 MB file, 139 µs frames),
# and trading that for a smaller download would be trading the point of the
# project for the size of an archive. `abort` is not set either: the panic hook
# that restores the terminal is cheaper to keep than to reason about.
[profile.release]
strip = true
lto = true
codegen-units = 1
