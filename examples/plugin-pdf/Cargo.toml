[package]
name = "rano-plugin-pdf"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
# `rlib` as well as `cdylib`: the reader is a pure function of a path and a viewport, so it is
# tested natively (`cargo test` here) and shipped as wasm from the same source.
crate-type = ["cdylib", "rlib"]

[features]
# **Both off by default.** The two imports a page needs (`rano.convert_page` for a picture,
# `rano.convert_page_text` for the text) are not in `src/plugin.rs` yet, and a module that imports
# what the host cannot provide fails to instantiate — it could not even say why. A build without
# them still claims a `.pdf` and answers it with a sentence naming what the host lacks. Turn them
# on when the host half lands:
#
#   cargo build --release --target wasm32-unknown-unknown --features page-png,page-text
default = []
# `rano.convert_page(page, dpi)`: one page rasterized, as PNG bytes.
page-png = []
# `rano.convert_page_text(page)`: one page's text, for a terminal with no picture protocol.
page-text = []

[dependencies]
# The Rust SDK: the ABI's pointers, arena and result block live there, not here.
rano-plugin = { path = "../../sdks/rust" }
# Inflate, for the PNG a page comes back as. Pure Rust, no C, and already in rano's own lockfile
# (through flate2), so a plugin that decodes a page costs no new crate in the tree.
miniz_oxide = "0.9"

[dev-dependencies]
# Only to build the PNGs the decoder's tests read: the plugin never compresses anything.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[profile.release]
opt-level = "s"
strip = true
lto = true
panic = "abort"
