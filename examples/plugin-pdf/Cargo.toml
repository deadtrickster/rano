[package]
name = "rano-plugin-pdf"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
# `rlib` as well as `cdylib`: the reader is a pure function of a path and a viewport, so it is
# tested natively (`cargo test` here) and shipped as wasm from the same source.
crate-type = ["cdylib", "rlib"]

[features]
# **Both off by default.** A module that imports what the host cannot provide fails to instantiate
# and could not even say why, so the two imports are a build's choice: the config grants
# `capabilities = ["convert-page"]` and a module built with these features is refused at load
# without it. A build without them still claims a `.pdf` and answers it with a sentence naming what
# the host lacks.
#
#   cargo build --release --target wasm32-unknown-unknown --features page-picture,page-text
default = []
# `rano.convert_page(page, dpi, out_ptr, out_cap)`: one page rasterized, as `[width][height][rgb]`.
page-picture = []
# `rano.convert_page_text(page, out_ptr, out_cap)`: one page's text, for a terminal with no picture
# protocol.
page-text = []

[dependencies]
# The Rust SDK: the ABI's pointers, arena and result block live there, not here.
rano-plugin = { path = "../../sdks/rust" }

[profile.release]
opt-level = "s"
strip = true
lto = true
panic = "abort"
