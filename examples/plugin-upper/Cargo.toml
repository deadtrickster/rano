[package]
name = "rano-plugin-upper"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# The Rust SDK: the ABI's raw pointers, the result block and the arena live there, not here.
rano-plugin = { path = "../../sdks/rust" }

[profile.release]
opt-level = "s"
strip = true
lto = true
panic = "abort"
